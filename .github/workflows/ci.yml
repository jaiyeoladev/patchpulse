name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t patchpulse:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e DEMO_MODE=true patchpulse:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 2; done
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8000/login
          docker logs app
